services:
  postgres:
    image: postgres:17
    container_name: impulse-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USERNAME}/impulse-api:latest
    container_name: impulse-api
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.impulse.rule=Host(`api.impulse.alber.ee`)"
      - "traefik.http.routers.impulse.entrypoints=websecure"
      - "traefik.http.routers.impulse.tls.certresolver=letsencrypt"
      - "traefik.http.services.impulse.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
  proxy:
    external: true
